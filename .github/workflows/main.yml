name: Build NorthFace APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get NorthFace project
        uses: actions/checkout@v4

      - name: Extract fullscreen Android project
        run: |
          unzip -q NorthFace-Android-v2.1-Ultimate-Fullscreen.zip
          cp -r extracted/NorthFace-Android-v2.1-Ultimate-Fullscreen/. northface-project/
      - name: Set NorthFace website URL
        run: |
          sed -i 's#https://capable-choux-e67f2b.netlify.app/#https://ubiquitous-pegasus-e8d9b0.netlify.app/#g' northface-project/app/src/main/AndroidManifest.xml
          sed -i 's#https://capable-choux-e67f2b.netlify.app/.well-known/assetlinks.json#https://ubiquitous-pegasus-e8d9b0.netlify.app/.well-known/assetlinks.json#g' northface-project/app/src/main/res/values/strings.xml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build NorthFace
        working-directory: northface-project
        run: gradle assembleDebug

      - name: Print APK certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs northface-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload NorthFace APK
        uses: actions/upload-artifact@v4
        with:
          name: NorthFace-APK-v2.1-Ultimate-Fullscreen
          path: northface-project/app/build/outputs/apk/debug/app-debug.apk
