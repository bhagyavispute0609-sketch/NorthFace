name: Build NorthFace APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get NorthFace project
        uses: actions/checkout@v4

      - name: Extract NorthFace Android project
        run: |
          unzip -q NorthFace-Android-v2.3-GracefulDragon-Verified.zip -d northface-project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install permanent NorthFace signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NORTHFACE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > northface-release.keystore

      - name: Configure permanent release signing
        working-directory: northface-project/nf_android_v23
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NORTHFACE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NORTHFACE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace(
              "signingConfig signingConfigs.debug",
              """signingConfig signingConfigs.create("northfaceRelease") {
                  storeFile file("../../../../northface-release.keystore")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias "northface-release"
                  keyPassword System.getenv("KEY_PASSWORD")
              }"""
          )

          p.write_text(s)
          PY

      - name: Verify NorthFace URL
        run: |
          grep -R "graceful-dragon-6f9f89.netlify.app" northface-project/nf_android_v23 || true

      - name: Build final signed APK
        working-directory: northface-project/nf_android_v23
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NORTHFACE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NORTHFACE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease

      - name: Verify final APK certificate
        run: |
          echo "=== FINAL NORTHFACE CERTIFICATE ==="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            northface-project/nf_android_v23/app/build/outputs/apk/release/app-release.apk

      - name: Upload final NorthFace APK
        uses: actions/upload-artifact@v4
        with:
          name: NorthFace-FINAL-Permanent-Signed
          path: northface-project/nf_android_v23/app/build/outputs/apk/release/app-release.apk
