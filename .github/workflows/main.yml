name: Build NorthFace APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get NorthFace project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q NorthFace-Android-v2.2-GracefulDragon-Fullscreen.zip -d northface-project

      - name: Show project files
        run: |
          find northface-project -maxdepth 2 -type f | sort | head -100

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build NorthFace release APK
        working-directory: northface-project
        run: gradle assembleRelease

      - name: Print APK certificate fingerprint
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
          northface-project/app/build/outputs/apk/release/app-release.apk

      - name: Upload NorthFace APK
        uses: actions/upload-artifact@v4
        with:
          name: NorthFace-APK-v2.2
          path: northface-project/app/build/outputs/apk/release/app-release.apk
